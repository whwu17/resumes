work:
- title: "Stress 2.0 · Trade Wind Down（TWD）"
  time: "2024.01 - 至今"
  company: "野村（上海）信息技术有限公司 · Risk and Control Technology"
  position: "Analyst (Senior Software Developer)"
  content:
  - "负责 TWD Stress 2.0 项目的 Python 侧：从 UDW、Prism（ActivePivot 风险数据仓库）、市场数据与 Excel 输入多源取数（MDX / REST / Dremio SQL / 文件导出），完成 Data Object 与 Scenario 领域建模、后处理与落盘，单批约 800 MB（4 类 scenario × ~200 MB）。"
  - "主导数据源切换，与业务方完成 UAT 验收。"
  - "基于 Fingal 计算框架实现部分压力因子计算（含 CS01）；作为 ComputeGrid 调用方对接外部计算引擎，准备输入、回收结果。"
  - "重构 TWD 领域模型：data object 的 skid 统一为 identifier，消除对象重复创建；版本递增抽象为独立方法，保证各处版本语义一致。"
  - "使用 MinIO 作为 S3 兼容的对象存储。对访问开销做了调查：哪些调用成本高（如 ListObjects）、哪些低，并把访问从高成本改到低成本。"
  - "建设测试与变更证据：transactional 测试自动回滚，Spring test 全路径覆盖，为 miniosync / propstore / maestrologger 补测试并产出满足变更管控的 testing evidence。"
  - "基于 Prefect 编排 daily-stress 批任务，补齐 special task 与下游 lynx task 的 wait-for 依赖；担任 Maestro communication 的 lead：在 forward valuation（non-managed CVA）范围内，对接事件的发送与接收。"
  - "CI 类型检查里 SQL Server 的 BITS / LONGNVARCHAR 有一个小 bug，用 workaround 兼容，没有改类型检查本身。"
  - "熟练掌握 AI 辅助开发：Claude Code 日常用于重构、测试生成、分支合并、新旧数据源比对、最小化单测复现 debug、报障分析。"

  - "Scenario Extractor：生成压力情景数据，经 Risk Data Endpoint 供前端查询。"
  - "Hedges Composer Tool（HCT）：提取 Hedges 的 P&L，并计算不同 Trade Wind Down 时间下的 P&L。"
  - "RSST：用 SDL 定义 Stress 场景和 TWD 场景。"
  - "排查 Lynx parquet 文件读取中的 bug。"
- title: "市场数据 Python ETL 框架解析工具"
  time: "2023 - 2024"
  company: "野村（上海）信息技术有限公司 · Risk and Control Technology"
  position: "Analyst (Senior Software Developer)"
  content:
  - "聚合多 vendor 市场数据，提取各计算模型所需的市场风险数据；对照公共模块与定制模型优化代码逻辑。通过线上日志与 Dremio 定位并解决线上解析问题，与其他部门协作排查根因。"
  - "监听 ETL 信号量驱动对应模型；常用接口二次封装为 FastAPI；用 Status ID 解决模型调用耗时过长导致的阻塞与多进程并发问题。"
  - "处理 FastAPI 大数据量下的内存泄漏 / OOM：权限控制加 Gunicorn 重启机制；处理 log rotating 下模型读不到日志的问题。"
  - "将 ETL 整体迁移至 AWS，配置改为 YAML，用 systemd 与 Jenkins 触发自动部署；上线后检查与支持。"

- title: "风控 PnL 与 NM CVA 计算引擎（Full Revaluation and Non-Managed CVA Calculation Process）"
  time: "2023 - 2025"
  company: "野村（上海）信息技术有限公司 · Risk and Control Technology"
  position: "Analyst (Senior Software Developer)"
  content:
  - "担任 non-managed CVA 的 lead：需求、开发、上线与上线后的生产支持。"
  - "基于 Prefect 构建压力情景下的风险损益与 NM CVA 计算流程，用于指导交易决策；每笔交易在节点内计算，预处理与 ComputeGrid（蒙特卡洛）两端高度并行。"
  - "整合 ActivePivot（Prism）风险数据、交易信息与市场数据，结果写入 Dremio 与 AWS S3，交付下游 UI 团队。"
  - "设计并实现基于事件的监听器使流程自动化；生产环境支持，开发环境调试与持续监控。为全部输入设计按项目隔离的缓存目录结构；用 Lynx SCE 提取多维风险信息。"
  - "运行日本 CVA 批次并跨地区聚合结果；解决读写冲突的并发问题且保留并行度，限制任务并行度避免长时间等待。"
  - "重构过滤逻辑以兼容更多过滤器；按合规要求配置排除项与类型变更。用 Django 将结果以 Web 服务暴露，供用户获取目标文件。"


- title: "Lynx 交易数据 ETL 模块"
  time: "2023.06 - 2023.12"
  company: "野村（上海）信息技术有限公司 · Risk and Control Technology"
  position: "Analyst (Senior Software Developer)"
  content:
  - "负责 Lynx 模块对上游交易数据（trade data）的 ETL 与分析：数据库配置、按业务规则的增删改查、REST API 迁移。"
  - "完成 Lynx 1.0 → 2.0 的兼容性升级，保证上下游在版本切换期间不中断。"

internship:
- title: "用于人工智能标准化的中心化人脸检测模型"
  time: "2021.10 - 2021.12"
  company: "依图（上海）科技有限公司"
  position: "人工智能标准化研究组-研究员"
  content:
  - 协助Team进行数据挖掘、收集、整理、清洗和数据分析的工作。通过对投标项目管理数据进行筛选与分析，提出目前在投标过程中存在的问题与相应的解决方案。
  - 本人参与的项目是基于公安部的人脸识别投标方案的设计。在该项目中，本人负责对人工智能领域进行相关的探索，包括相关技术概念与知识，以及知识图谱、机器学习、深度学习等相关模型在真实数据集的落地和应用情况。并对数据和模型进行检索和分析，探索适合目前的方案设计。
  - 在检索目前的人脸识别模型方案，本人还负责匹配适用于中心化的人脸识别特征图生成和检测的模型，通过对这一模型的可能性与有效性进行探究，论证并落地实际的项目开发与大规模的实现。
  - 在项目进行过程中，本人对两侧的模型（中央模型、自适应模型）分别进行了实现的参考。对中央模型，设计了经中央（大数据集下的）处理后的人脸特征图的格式，并通过预训练模型进一步提高了中心侧的准确度。对自适应模型，设计了一种可能的用于提取对应（小数据集）的人脸识别方案。
  - 通过应用混淆矩阵的方式，将模型准确性提供给用户侧进行数据分析与应用。从而将方案的实际情况进行落地。
  - 作为人脸检测领域使用的标准化模型的一个例子，该项目提出了一个可能的案例来验证模型中使用的真实人脸图像的有效性和隐私保护，从而向招标用户论证项目的可行性。在投标结束后的实际生产过程中，可以基于这一标准化规范和可能的实现进一步探索，从而生产出更为有效的人脸识别模型。

- time: "2021.07 - 2021.10"
  title: "车道线数据闭环分析与可视化项目"
  company: "Nullmax Technology Co. ltd."
  position: "无人驾驶数据分析与可视化-实习生"
  content:
  - 基于车道线的无人驾驶数据分析与可视化任务。本人负责无人驾驶数据采集和整理，推动部门间问题的及时合理解决；负责数万张图片数据的清洗，标注和质量核对、校验等工作；负责数据场景的迭代更新。
  - 在实习期间，通过调研、对比和分别实现 (1) 基于数据库的Django (Python)实现方案和 (2) 基于现有可视化模块的Apache Zeppelin实现方案，确定较为有效的可视化效果。在此基础上，设计公共接口对数据库进行数据提取，并对路况、天气、不同难例的车道线信息进行数据分析和可视化，向企业和用户提供数据报告支持。
  - "该项目的目标是基于数据驱动的数据闭环。通过将 (1) 原始车辆路况和道路信息的采集数据在Apache Airflow上进行数据预处理，并通过 (2) 人工标注（例如本人负责的难例原因筛查与路标清晰度检查等）和自动分析相结合的方式，筛选出相应的车道线难例。（链接：https://mp.weixin.qq.com/s/OcTTeltep-FSUCCsBQOrYQ）"
  - 进一步，通过 (1) 优化和编写新的Shell和Python脚本，可分析出相应的算法改进方案与不足之处，帮助检测算法更好的得出相应结论。同时，(2) 分析其中可能出现的分类问题，为数据的收集和汇报打下基础。最后，(3) 撰写相关的数据闭环文档。
  - 在后期，本人还基于Electron.js，将所有脚本进行整合，提供图形化界面与默认配置，降低了不同脚本间环境的重复配置，以及脚本本身的使用门槛，从而更好的将重点关注于数据本身和数据任务，提升沟通的有效性和交互体验。
  - 在实现过程中，面对百万级的数据，本人提出了一种可减少读取次数的数据库改进方案，从而可以成功处理高数据量场景下的筛选时长，对前端页面可以提升近300%页面响应效率，成功缩短了响应时间，从而为走向大规模量产的数据闭环提供了更好的用户体验。

projects:
- time: "2022.01 - 2022.06"
  title: GitHub Pages设计与重构
  content:
  - 即本页面所在项目。基于原生HTML和Bootstrap规范设计的github.io的个人主页，采用响应式布局（同时适配手机 / 电脑端）与原生HTML / CSS制作。
  - 调研不同博客模板（例如Hexos、Gatsby、Jekyll等）并确定实现框架。设计有效的yaml格式，基于Liquid语法和Jekyll特性，使其能有效的匹配相关的个人信息，并设计了对应的数据与页面分离的布局。
  - 引入c-player等库函数用于辅助支持，从而更好的进行参数化，并对原库进行必要的源码改进（基于Typescript）。相关仓库可在https://github.com/Ivyee17/cPlayer中查询。
  - 参考时下最新的页面设计样例，对页面进行美观改进。使用aos动画库对动画元素进行设计。使用vcf和Canvas对名片进行生成，采用并优化Git Card的Git Repo信息卡片，使用Gitalk进行文章与组会讨论功能。
  - 由于GitHub Pages对Jekyll插件支持数量较少，本次实现中尽量降低第三方插件的依赖，从而实现gh-env的自动配置与部署。
- time: "2020.11 - 2021.03"
  title: 基于Tensorflow的RealNVP模型迁移
  content:
  - 使用RealNVP对CIFAR-10中的图片进行流处理，使其符合一定的数据分布。
  - 基于Tensorflow将RealNVP迁移至华为昇腾AI平台，并进行算子匹配。
  - 实现了相关迁移代码适配与离线推理，并合并入相关开源项目。
- time: "2021.04 - 2021.05"
  title: Ticketing仿大麦网在线票务平台
  content:
  - 软件架构设计课程项目。通过对大麦网上进行数据提取，进而获取演出信息。采用Spring Security进行安全校验，并使用Redis进行大并发量下的快速运行。采用分布式的方式进行部署和运行，并进行子网的配置。
  - 在日志方面使用Elastic search、logstash和kibana进行日志的分析和提取，方便定位开发问题。
- time: "2021.03 - 2021.04"
  title: 交通灯方向数据提取与分析
  content:
  - 使用Python对图片数据进行预处理和直方图生成，采用SIFT进行交通等方向匹配。
  - 在数据集中使用真实环境下的信号灯作为数据，以保证数据的有效性。
- time: "2019.04 - 2020.06"
  title: "基于自动重构算法实现的设计阶段代码复杂度降解工具"
  content:
  - 该工具将基于遗传算法进行实现，以设计类图为输入，实现软件复杂度的降解。
  - 该平台基于Spring Boot(Jama)和Vue.js(Echarts)开发，使用MySQL和Redis数据库进行持久化存储。同时，还将提供Graphviz的桌面版，使用户可以离线进行操作。
  - 本人主要负责产品和数据库设计、代码实现及部署、接口调用、客户端展示、单元测试等。
  - 在KSEM 2021(CCF-C)上以第一作者发表论文：Analyzing and Recommending Development Order Based on Design Class Diagram，实现了相关代码并申请了软件著作权。
- time: "2018.02 - 2018.06"
  title: 面向学生的财务报销管理平台
  content: 
  - 基于Spring Boot和BootStrap开发，使用MySQL数据库。
  - 本人主要负责数据库的设计、CURD操作、MyBatis中间件编写。
- time: "2018.07 - 2018.08"
  title: MNIST数据集下的算法比较
  content:
  - 课程作业。基于Python语言实现，描述PCA、KNN、核函数下对MNIST数据集的训练模型。




