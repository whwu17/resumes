projects:
- time: 2019.04 - 2021.08
  title: SRT — Design-Stage Code Complexity Reduction via Automated Refactoring
  content:
  - Genetic algorithm over design class diagrams to reduce software complexity; compared against a classical greedy baseline, later improved with clustering.
  - Spring Boot (Jama), Vue.js (Echarts), MySQL, Redis; Graphviz desktop mode for offline use. Product design, database design, implementation, API, GUI, unit tests.
  - 'First-author paper at KSEM 2021 (CCF-C): Analyzing and Recommending Development Order Based on Design Class Diagram. Software copyright 2020SR0651562.'
- time: 2020.11 - 2021.03
  title: RealNVP migration to Huawei Ascend
  content:
  - RealNVP flow model on CIFAR-10 to fit a target data distribution.
  - Migrated the TensorFlow model to Huawei Ascend, matching operators; wrote migration adapters and offline-inference scripts in Python.
  - Filed 5 platform issues and merged the work into the Gitee open-source project (Ascend Model Zoo).
